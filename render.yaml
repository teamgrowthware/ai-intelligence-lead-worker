services:
  - type: web
    name: ai-lead-intelligence
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-lead-intel-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: APP_URL
        # This will need to be updated after deployment if they use a custom domain, but Render provides a generic URL.
        value: "https://ai-lead-intelligence.onrender.com" 

databases:
  - name: ai-lead-intel-db
    databaseName: aileadintel
    user: aiuser
    plan: free
